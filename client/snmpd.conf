# SNMP agent for the Ubuntu client lab machine
# Exposes CPU, memory, disk, and network counters via standard MIBs

agentAddress udp:161
view   all    included  .1
rocommunity public  default    -V all

# Required for HOST-RESOURCES-MIB (CPU, memory, storage)
includeAllDisks  10%

# System identity shown in Observium
sysLocation    Infrastructure Monitoring Lab - Ubuntu Client
sysContact     lab-admin@example.com
sysServices    72
